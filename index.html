<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>أعدادي اللطيفة – لعبة تعلّم الأرقام العربية</title>
<meta name="description" content="لعبة تفاعلية لتعليم الأطفال الأرقام العربية ٠ – ٥٠">
<meta property="og:type" content="website">
<meta property="og:site_name" content="أعدادي اللطيفة">
<meta property="og:locale" content="ar_AR">
<meta property="og:title" content="أعدادي اللطيفة – لعبة تعلّم الأرقام العربية">
<meta property="og:description" content="لعبة ممتعة تعلّم الأطفال الأرقام العربية ٠ – ٥٠ بالأشكال والأصوات.">
<meta property="og:image" content="https://a3dady.vercel.app/img/og-image.png">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="شعار لعبة أعدادي اللطيفة">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="أعدادي اللطيفة – لعبة تعلّم الأرقام العربية">
<meta name="twitter:description" content="لعبة ممتعة تعلّم الأطفال الأرقام العربية ٠ – ٥٠ بالأشكال والأصوات.">
<meta name="twitter:image" content="https://a3dady.vercel.app/img/og-image.png">
<link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<meta name="theme-color" content="#DDF1FF">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Cairo:wght@600;800&family=Tajawal:wght@700&display=swap" rel="stylesheet">
<!-- الأنماط في style.css والبرمجة في app.js -->
<link rel="stylesheet" href="style.css">
</head>
<body class="loading">
<div id="splash" aria-label="جارٍ التحميل"><img class="sp-logo" src="img/logo.webp" width="220" height="220" alt="أعدادي اللطيفة" fetchpriority="high" decoding="sync"><div class="sp-track" role="progressbar" aria-valuemin="0" aria-valuemax="100"><div class="sp-fill"></div></div></div>
<div class="sky" aria-hidden="true">
  <div class="cloud" style="--t:6%;--w:180px;--x:5vw;--d:70s;--o:-12s"></div>
  <div class="cloud" style="--t:18%;--w:120px;--x:55vw;--d:95s;--o:-60s"></div>
  <div class="cloud" style="--t:30%;--w:150px;--x:25vw;--d:80s;--o:-35s"></div>
  <div class="cloud" style="--t:11%;--w:100px;--x:80vw;--d:110s;--o:-85s"></div>
  <div class="cloud" style="--t:42%;--w:130px;--x:65vw;--d:90s;--o:-20s"></div>
  <div class="hill h1"></div>
  <div class="hill h2"></div>
</div>
<div id="home" role="dialog" aria-label="القائمة الرئيسية">
  <div class="hl">
    <img src="img/logo.webp" width="220" height="220" alt="أعدادي اللطيفة">
    <span class="spark" aria-hidden="true">✦</span><span class="spark" aria-hidden="true">✦</span><span class="spark" aria-hidden="true">✦</span><span class="spark" aria-hidden="true">✦</span>
  </div>
  <nav class="hmenu">
    <button class="btn hbtn h1b" id="hb1">الأعداد <span dir="ltr">(0 - 10)</span></button>
    <button class="btn hbtn h2b" id="hb2">الأعداد <span dir="ltr">(11 - 20)</span></button>
    <button class="btn hbtn h3b" id="hb3">الأعداد <span dir="ltr">(21 - 50)</span></button>
    <button class="btn hbtn h4b" id="hb4">العب مع الأعداد</button>
    <button class="btn hbtn h5b" id="hb5">إنجازاتي</button>
  </nav>
</div>
<header class="top">
<h1 class="logo"><button id="homeBtn" aria-label="الصفحة الرئيسية"><img src="img/logo.webp" width="220" height="220" alt="أعدادي اللطيفة"></button></h1>
<div class="tabs">
  <div class="digits" id="digits" role="group" aria-label="شكل الأرقام">
  <button class="tab dg" id="d-ar" aria-pressed="true" aria-label="أرقام عربية مشرقية">٣٢١</button>
  <button class="tab dg" id="d-en" aria-pressed="false">123</button>
</div>
  <button class="tab" id="mute" aria-label="كتم الصوت" aria-pressed="false"><svg class="ic ic-lg" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5.5 12.5h4.5l6-5v17l-6-5H5.5z"/><path d="M21 12.2c1.9 2.3 1.9 5.3 0 7.6M24.4 9.2c3.5 4 3.5 9.6 0 13.6"/></svg></button>
</div>
</header>

<main>
  <!-- بطاقات الأعداد (للقسم المفتوح) وتحتها زر العدّ بالصوت -->
  <section id="cards" class="hidden">
    <div class="cards" id="cardGrid"></div>
    <div class="count-row"><button class="tab" id="countBtn" aria-pressed="false" aria-label="عُدّ أرقام اللوحة"><svg class="ic" viewBox="0 0 32 32" fill="currentColor" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" aria-hidden="true"><path d="M11 7.5v17l14-8.5z"/></svg></button></div>
  </section>

  <!-- إنجازاتي -->
  <section id="ach" class="hidden">
    <div class="ach-top">
      <div class="ach-title">إنجازاتي</div>
      <div class="ach-line"><span id="achDone"></span><span id="achPct"></span></div>
      <div class="pbar" role="progressbar" aria-label="نسبة الإنجاز" aria-valuemin="0" aria-valuemax="100" id="achBar"><i id="achFill"></i></div>
      <div class="ach-sub" id="achPts"></div>
    </div>
    <div class="ach-list" id="achList"></div>
  </section>

  <!-- تعلّم -->
  <section id="learn" class="hidden">
    <div class="stage split" aria-live="polite">
      <svg class="frame" aria-hidden="true"><rect x="1.5" y="1.5" rx="22" ry="22"/></svg>
      <div class="half numhalf">
        <div class="big" id="big">١</div>
        <div class="word" id="word">واحد</div>
      </div>
      <div class="half shapes" id="things" aria-hidden="true"></div>
    </div>
    <div class="shape-row"><button class="tab" id="shapeBtn" aria-label="شكل آخر"><svg class="ic" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M26 13a10 10 0 0 0-18-3.5M6 5.5v4.5h4.5M6 19a10 10 0 0 0 18 3.5M26 26.5V22h-4.5"/></svg></button><button class="tab" id="miniBtn" aria-label="العب بهذا الرقم"><svg class="ic" viewBox="0 0 32 32" fill="currentColor" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" aria-hidden="true"><path d="M11 7.5v17l14-8.5z"/></svg></button></div>
    <div class="grid" id="grid"></div>
  </section>

  <!-- العب -->
  <section id="play" class="hidden">
    <div id="round">
      <div class="toprow" id="rowP">
      <div class="stats"><div class="stat"><span class="lbl">النقاط</span><div class="pbar" role="progressbar" aria-label="تقدم النقاط"><i id="sfill"></i></div><b id="score">٠</b></div><div class="stat"><span class="lbl">السؤال</span><div class="pbar" role="progressbar" aria-label="تقدم الأسئلة"><i id="pfill"></i></div><b id="count">١ من ١٠</b></div></div>
      </div>
      <div class="stage" style="padding:10px"><svg class="frame" aria-hidden="true"><rect x="1.5" y="1.5" rx="22" ry="22"/></svg><div class="half shapes play" id="qthings" aria-hidden="true"></div></div>
      <div class="q">كم عدد الأشكال؟</div>
      <div class="choices" id="choices"></div>
      <div class="msg" id="msg" aria-live="polite"></div>
    </div>
    <div id="lock" class="stage result hidden"><svg class="frame" aria-hidden="true"><rect x="1.5" y="1.5" rx="22" ry="22"/></svg>
      <div class="word">تعلّم أولًا</div>
      <div class="q">أكمل اختبار رقمين على الأقل بزر ▶ في صفحة الأعداد، ثم عُد لتلعب بهما</div>
      <button class="btn" id="toLearn">إلى الأعداد</button>
    </div>
    <div id="result" class="stage result hidden"><svg class="frame" aria-hidden="true"><rect x="1.5" y="1.5" rx="22" ry="22"/></svg>
      <div class="word">أحسنت!</div>
      <div class="stars" id="stars"></div>
      <div class="q" id="final"></div>
      <div class="q" id="best" style="font-size:1.1rem;opacity:.75"></div>
      <button class="btn" id="again"><svg class="ic" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 3.5c5.5 0 9 4 9 9.2 0 5.2-3.6 9-9 9s-9-3.8-9-9C7 7.5 10.5 3.5 16 3.5z" fill="#FF6B5E" stroke="#17304D" stroke-width="2"/><path d="M16 21.7l-2 3h4z" fill="#FF6B5E" stroke="#17304D" stroke-width="1.6" stroke-linejoin="round"/><path d="M16 24.7c-2 1.5 2 2.5 0 4" fill="none" stroke="#17304D" stroke-width="1.6" stroke-linecap="round"/><path d="M11.2 8.6q1.2-1.6 3-1.8" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/><circle cx="12.8" cy="12" r="1.5" fill="#17304D"/><circle cx="19.2" cy="12" r="1.5" fill="#17304D"/><path d="M13.5 15.4q2.5 2.6 5 0" fill="none" stroke="#17304D" stroke-width="1.8" stroke-linecap="round"/></svg> العب مرة أخرى</button>
    </div>
  </section>
</main>

<!-- لعبة على الرقم المحدد (اختبار الرقم) -->
<div id="mini" class="hidden" role="dialog" aria-modal="true" aria-label="اختبار الرقم">
  <div class="m-in">
    <div class="m-top">
      <div class="m-count" id="mCount"></div>
      <button class="tab" id="mClose" aria-label="إغلاق"><svg class="ic" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M8 8l16 16M24 8L8 24"/></svg></button>
    </div>
    <div class="m-num" id="mNum"></div>
    <div id="mRound" class="m-in">
      <div class="m-q" id="mQ"></div>
      <div class="m-cards" id="mCards"></div>
      <div class="msg" id="mMsg" aria-live="polite"></div>
    </div>
  </div>
  <!-- نافذة إتمام الاختبار -->
  <div id="mResult" class="m-res hidden" role="status">
    <div class="m-res-card" id="mResCard">
      <div class="word" id="mWord">أحسنت!</div>
      <div class="stars" id="mStars"></div>
      <div class="m-q" id="mScore"></div>
      <div class="cd" id="mCd" aria-hidden="true"><svg viewBox="0 0 52 52"><circle class="cd-bg" cx="26" cy="26" r="22"/><circle class="cd-ring" id="mCdRing" cx="26" cy="26" r="22"/></svg><span id="mCdN"></span></div>
      <div class="m-btns">
        <button class="tab rbtn" id="mAgain" aria-label="إعادة الاختبار"><svg class="ic" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M24.6 11A9.5 9.5 0 1 0 25.5 17.5"/><path d="M25.5 5.5v6h-6"/></svg></button>
        <button class="tab rbtn" id="mNext" aria-label="الرقم التالي"><svg class="ic" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 8l-8 8 8 8M25 8l-8 8 8 8"/></svg></button>
      </div>
    </div>
  </div>
</div>

<!-- نافذة: هل أتممت دراسة الرقم؟ -->
<div id="ask" class="hidden" role="dialog" aria-modal="true" aria-labelledby="askQ">
  <div class="ask-card">
    <button class="tab" id="askClose" aria-label="إغلاق"><svg class="ic" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" aria-hidden="true"><path d="M9 9l14 14M23 9L9 23"/></svg></button>
    <div class="ask-q" id="askQ">هل أتممت دراسة الرقم <b id="askN"></b>؟</div>
    <button class="tab" id="askTest"><svg class="ic" viewBox="0 0 32 32" fill="currentColor" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" aria-hidden="true"><path d="M11 7.5v17l14-8.5z"/></svg>اختبر الآن</button>
    <button class="tab" id="askSkip">ليس الآن</button>
  </div>
</div>

<!-- نافذة تثبيت التطبيق -->
<div id="install" class="hidden" role="dialog" aria-modal="true" aria-label="تثبيت التطبيق">
  <div class="ins-card">
    <button class="tab" id="insClose" aria-label="إغلاق"><svg class="ic" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" aria-hidden="true"><path d="M9 9l14 14M23 9L9 23"/></svg></button>
    <img src="img/logo.webp" width="220" height="220" alt="أعدادي اللطيفة">
    <button class="tab" id="insBtn"><svg class="ic" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 5v14M10 13.5l6 6 6-6M7 25h18"/></svg> تثبيت</button>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
